name: bioverse-ai

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bioverse}
      POSTGRES_USER: ${POSTGRES_USER:-bioverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioverse_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bioverse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bioverse}:${POSTGRES_PASSWORD:-bioverse_dev}@database:5432/${POSTGRES_DB:-bioverse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBCHEM_TIMEOUT_SECONDS: ${PUBCHEM_TIMEOUT_SECONDS:-10}
      PUBCHEM_RETRY_COUNT: ${PUBCHEM_RETRY_COUNT:-2}
      PUBCHEM_RETRY_BACKOFF_SECONDS: ${PUBCHEM_RETRY_BACKOFF_SECONDS:-0.25}
      PUBCHEM_MAX_SEARCH_RESULTS: ${PUBCHEM_MAX_SEARCH_RESULTS:-10}
      PUBCHEM_MAX_STRUCTURE_BYTES: ${PUBCHEM_MAX_STRUCTURE_BYTES:-5000000}
      COMPOUND_CACHE_TTL_SECONDS: ${COMPOUND_CACHE_TTL_SECONDS:-900}
      COMPOUND_CACHE_MAX_ENTRIES: ${COMPOUND_CACHE_MAX_ENTRIES:-256}
      RCSB_TIMEOUT_SECONDS: ${RCSB_TIMEOUT_SECONDS:-15}
      RCSB_RETRY_COUNT: ${RCSB_RETRY_COUNT:-2}
      RCSB_RETRY_BACKOFF_SECONDS: ${RCSB_RETRY_BACKOFF_SECONDS:-0.5}
      RCSB_MAX_SEARCH_RESULTS: ${RCSB_MAX_SEARCH_RESULTS:-10}
      RCSB_MAX_JSON_BYTES: ${RCSB_MAX_JSON_BYTES:-5000000}
      RCSB_MAX_STRUCTURE_BYTES: ${RCSB_MAX_STRUCTURE_BYTES:-25000000}
      RCSB_CACHE_TTL_SECONDS: ${RCSB_CACHE_TTL_SECONDS:-3600}
      RCSB_CACHE_MAX_ENTRIES: ${RCSB_CACHE_MAX_ENTRIES:-128}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BIOVERSE_API_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  bioverse_postgres_data:
